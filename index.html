<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameVerse</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="bg-dark text-white p-3 shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="logo">🎮 GameVerse</h1>

            <nav>
                <a href="#destaques" class="text-white me-3 text-decoration-none">Destaques</a>
                <a href="#games" class="text-white text-decoration-none">Jogos</a>
            </nav>
        </div>
    </header>


    <!-- CAROUSEL -->
    <section class="container mt-5" id="destaques">
        <h2 class="mb-4">Jogos em Destaque</h2>

        <div id="carouselGames" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner" id="carousel-content">
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselGames" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carouselGames" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>


    <!-- TODOS OS GAMES -->
    <section class="container mt-5" id="games">
        <h2 class="mb-4">Todos os Jogos</h2>

        <div class="row" id="games-container">
        </div>
    </section>


    <!-- SOBRE O ALUNO -->
    <section class="container mt-5 mb-5">
        <div class="card shadow p-4">
            <h2>Sobre o Desenvolvedor</h2>

            <div class="row align-items-center mt-3">
                <div class="col-md-3 text-center">
                    <img src="https://i.pravatar.cc/200" class="perfil-img" alt="Aluno">
                </div>

                <div class="col-md-9">
                    <h4>Seu Nome</h4>

                    <p>
                        Estudante de Desenvolvimento Web apaixonado por tecnologia,
                        design responsivo e experiências digitais modernas.
                    </p>

                    <p>
                        Este projeto foi desenvolvido utilizando HTML, CSS,
                        JavaScript, Bootstrap e JSON.
                    </p>
                </div>
            </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>

</body>
</html>
